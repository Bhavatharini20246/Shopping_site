
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shopping Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f4f4;
}

header {
    background: #222;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: orange;
}

.search {
    padding: 10px;
    width: 220px;
    border: none;
    border-radius: 5px;
}

.cart {
    background: orange;
    padding: 10px 15px;
    border-radius: 5px;
    color: black;
    font-weight: bold;
}

.banner {
    background: #ff9800;
    color: white;
    text-align: center;
    padding: 45px 15px;
}

.banner h1 {
    margin-bottom: 10px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 30px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px #ccc;
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

.product h3 {
    margin: 10px;
}

.price {
    color: green;
    font-weight: bold;
    margin: 10px;
}

button {
    background: #222;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: orange;
    color: black;
}

#cartItems {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
    gap: 10px;
}

.cart-item button {
    padding: 5px 10px;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h2>MyShop</h2>

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Search products..."
        oninput="searchProducts()"
    >

    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</header>

<section class="banner">
    <h1>Welcome to My Shopping Store</h1>
    <p>Shop your favourite products at the best prices!</p>
</section>

<h2 style="text-align:center; margin-top:25px;">
    Our Products
</h2>

<div class="products" id="productList"></div>

<h2 style="text-align:center; margin-top:20px;">
    Shopping Cart
</h2>

<div id="cartItems">
    <p>Your cart is empty!</p>
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<footer>
    <p>© 2026 MyShop. All Rights Reserved.</p>
</footer>

<script>

// Product details
const products = [
    {
        id: 1,
        name: "Headphones",
        price: 999,
        image: "https://placehold.co/300x200?text=Headphones"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1499,
        image: "https://placehold.co/300x200?text=Smart+Watch"
    },
    {
        id: 3,
        name: "Shoes",
        price: 1999,
        image: "https://placehold.co/300x200?text=Shoes"
    },
    {
        id: 4,
        name: "Backpack",
        price: 799,
        image: "https://placehold.co/300x200?text=Backpack"
    }
];

let cart = [];

// Display products
function displayProducts(items) {
    const productList = document.getElementById("productList");

    productList.innerHTML = "";

    items.forEach(product => {
        productList.innerHTML += `
            <div class="product">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p class="price">₹${product.price}</p>
                <button onclick="addToCart(${product.id})">
                    Add to Cart
                </button>
            </div>
        `;
    });
}

// Add product to cart
function addToCart(id) {
    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity++;
    } else {
        const product = products.find(p => p.id === id);

        cart.push({
            ...product,
            quantity: 1
        });
    }

    updateCart();
}

// Update cart
function updateCart() {
    const cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    if (cart.length === 0) {
        cartItems.innerHTML = "<p>Your cart is empty!</p>";
    }

    cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        cartItems.innerHTML += `
            <div class="cart-item">
                <span>${item.name}</span>
                <span>₹${item.price}</span>

                <button onclick="changeQuantity(${item.id}, -1)">
                    -
                </button>

                <span>${item.quantity}</span>

                <button onclick="changeQuantity(${item.id}, 1)">
                    +
                </button>

                <button onclick="removeItem(${item.id})">
                    Remove
                </button>
            </div>
        `;
    });

    document.getElementById("cartCount").innerText = count;
    document.getElementById("total").innerText = total;
}

// Change quantity
function changeQuantity(id, amount) {
    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity += amount;

        if (item.quantity <= 0) {
            cart = cart.filter(p => p.id !== id);
        }
    }

    updateCart();
}

// Remove product
function removeItem(id) {
    cart = cart.filter(p => p.id !== id);
    updateCart();
}

// Search products
function searchProducts() {
    const value = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(value)
    );

    displayProducts(filtered);
}

// Initial display
displayProducts(products);

</script>

</body>
</html>
